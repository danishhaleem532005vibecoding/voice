<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PakVoice — Real-Time Pakistan & World News</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#16a34a',
            'pakistan-green': '#01411c',
            'dark-bg': '#0a0a0f',
            'dark-surface': '#111118',
            'dark-elevated': '#1a1a24',
            'dark-border': '#2a2a3a'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            urdu: ['Noto Nastaliq Urdu', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Outfit', sans-serif; }
    
    /* Animations */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .animate-pulse-dot { animation: pulse-dot 2s infinite ease-in-out; }
    
    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .ticker-track {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 40s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    
    .news-card { transition: all 0.3s ease; }
    .news-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    
    /* Loader */
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #16a34a;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Translation Toolbar */
    #selection-toolbar {
      display: none;
      position: absolute;
      z-index: 9999;
      background: #1f2937;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 13px;
    }
    .toolbar-btn { cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background 0.2s; }
    .toolbar-btn:hover { background: #374151; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300">

  <!-- Breaking News Ticker -->
  <div class="bg-red-600 text-white flex items-center h-10 overflow-hidden relative z-50">
    <div class="bg-red-700 h-full px-4 font-bold flex items-center gap-2 uppercase tracking-wider text-xs flex-shrink-0 z-10">
      <span class="text-[8px] animate-pulse-dot">●</span> Breaking
    </div>
    <div class="flex-1 overflow-hidden relative h-full">
      <div id="ticker-content" class="ticker-track absolute top-1/2 -translate-y-1/2 w-full">
        Loading breaking news...
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
        <div class="w-10 h-10 bg-pakistan-green text-white rounded-xl flex items-center justify-center shadow-lg">
          <i class="ri-flag-fill text-xl"></i>
        </div>
        <div>
          <h1 class="font-display font-black text-2xl text-pakistan-green leading-none">PakVoice</h1>
          <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Real-Time News</p>
        </div>
      </div>
      
      <nav class="hidden md:flex items-center gap-6 font-medium text-sm">
        <a href="#" onclick="filterNews('pakistan')" class="hover:text-brand transition">Pakistan</a>
        <a href="#" onclick="filterNews('world')" class="hover:text-brand transition">World</a>
        <a href="#" onclick="filterNews('business')" class="hover:text-brand transition">Business</a>
        <a href="#" onclick="filterNews('technology')" class="hover:text-brand transition">Tech</a>
        <a href="#" onclick="filterNews('sports')" class="hover:text-brand transition">Sports</a>
      </nav>

      <div class="flex items-center gap-4">
        <button onclick="toggleDarkMode()" class="text-gray-600 hover:text-gray-900 p-2 rounded-full hover:bg-gray-100 transition">
          <i id="theme-icon" class="ri-moon-fill text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Hero Section (Top Story) -->
    <section id="hero-section" class="mb-12">
      <div class="h-[400px] w-full rounded-2xl bg-gray-200 flex items-center justify-center">
        <div class="loader"></div>
      </div>
    </section>

    <!-- Latest News Grid -->
    <section>
      <div class="flex items-center justify-between mb-6">
        <h2 id="section-title" class="font-display text-2xl font-bold border-l-4 border-pakistan-green pl-3">Latest News</h2>
        <button onclick="fetchNews()" class="text-sm font-semibold text-brand hover:underline flex items-center gap-1">
          <i class="ri-refresh-line"></i> Refresh
        </button>
      </div>
      
      <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- News Cards will be injected here -->
      </div>
    </section>
  </main>

  <!-- Selection Toolbar -->
  <div id="selection-toolbar">
    <div class="flex items-center gap-1">
      <div class="toolbar-btn flex items-center gap-1" onclick="readAloud()">
        <i class="ri-volume-up-line"></i> Listen
      </div>
      <div class="toolbar-btn flex items-center gap-1" onclick="copyText()">
        <i class="ri-file-copy-line"></i> Copy
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-12 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <div class="w-12 h-12 bg-pakistan-green text-white rounded-xl flex items-center justify-center mx-auto mb-4">
        <i class="ri-flag-fill text-2xl"></i>
      </div>
      <h3 class="font-display font-black text-2xl mb-4">PakVoice</h3>
      <p class="text-gray-400 max-w-lg mx-auto mb-8 text-sm">
        Aggregated real-time news from trusted global and local sources. This site runs entirely in the browser using public APIs.
      </p>
      <div class="text-gray-500 text-sm">
        &copy; <span id="year"></span> PakVoice. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // --- DARK MODE ---
    let isDark = false;
    function toggleDarkMode() {
      isDark = !isDark;
      if (isDark) {
        document.body.classList.add('dark', 'bg-dark-bg', 'text-white');
        document.body.classList.remove('bg-gray-50', 'text-gray-900');
        document.getElementById('theme-icon').classList.replace('ri-moon-fill', 'ri-sun-fill');
      } else {
        document.body.classList.remove('dark', 'bg-dark-bg', 'text-white');
        document.body.classList.add('bg-gray-50', 'text-gray-900');
        document.getElementById('theme-icon').classList.replace('ri-sun-fill', 'ri-moon-fill');
      }
    }

    // --- NEWS FETCHING API (rss2json + GDELT) ---
    const RSS_URLS = {
      pakistan: 'https://www.dawn.com/feed',
      world: 'https://feeds.bbci.co.uk/news/world/rss.xml',
      business: 'https://feeds.bbci.co.uk/news/business/rss.xml',
      technology: 'https://feeds.bbci.co.uk/news/technology/rss.xml',
      sports: 'https://www.thenews.com.pk/rss/1/11'
    };

    let currentCategory = 'pakistan';

    async function filterNews(category) {
      currentCategory = category;
      const titles = {
        pakistan: 'Pakistan Latest',
        world: 'World News',
        business: 'Business & Economy',
        technology: 'Technology News',
        sports: 'Sports Updates'
      };
      document.getElementById('section-title').textContent = titles[category] || 'Latest News';
      await fetchNews();
    }

    async function fetchNews() {
      const grid = document.getElementById('news-grid');
      const hero = document.getElementById('hero-section');
      
      grid.innerHTML = '<div class="col-span-full flex justify-center py-10"><div class="loader"></div></div>';
      
      try {
        // We use rss2json API to easily parse RSS feeds in the browser
        const rssUrl = RSS_URLS[currentCategory] || RSS_URLS.pakistan;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        if (data.status === 'ok' && data.items.length > 0) {
          renderNews(data.items);
          updateTicker(data.items);
        } else {
          grid.innerHTML = '<p class="text-gray-500">Failed to load news. Try again later.</p>';
        }
      } catch (error) {
        console.error('Error fetching news:', error);
        grid.innerHTML = '<p class="text-red-500">Error loading news feed.</p>';
      }
    }

    function renderNews(articles) {
      const hero = document.getElementById('hero-section');
      const grid = document.getElementById('news-grid');
      grid.innerHTML = '';

      if (articles.length === 0) return;

      // 1. Render Hero Article (First item)
      const topArticle = articles[0];
      const fallbackImage = 'https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=1200&q=80';
      const topImage = topArticle.thumbnail || topArticle.enclosure?.link || fallbackImage;
      
      hero.innerHTML = `
        <a href="${topArticle.link}" target="_blank" class="block relative h-[400px] md:h-[500px] w-full rounded-3xl overflow-hidden group shadow-xl">
          <img src="${topImage}" alt="News Image" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.src='${fallbackImage}'">
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
          <div class="absolute bottom-0 left-0 p-6 md:p-10 text-white">
            <span class="inline-block px-3 py-1 bg-brand text-xs font-bold rounded-full mb-3 uppercase tracking-wide">${currentCategory}</span>
            <h2 class="font-display text-3xl md:text-5xl font-bold leading-tight mb-3 drop-shadow-md">${topArticle.title}</h2>
            <p class="text-gray-200 line-clamp-2 max-w-3xl mb-4 text-sm md:text-base">${topArticle.description.replace(/<[^>]*>?/gm, '')}</p>
            <div class="flex items-center gap-3 text-xs text-gray-300 font-medium">
              <span><i class="ri-time-line"></i> ${new Date(topArticle.pubDate).toLocaleString()}</span>
              <span><i class="ri-user-line"></i> ${topArticle.author || 'Editorial'}</span>
            </div>
          </div>
        </a>
      `;

      // 2. Render Grid Articles
      const gridArticles = articles.slice(1, 13);
      gridArticles.forEach(article => {
        const image = article.thumbnail || article.enclosure?.link || fallbackImage;
        const html = `
          <a href="${article.link}" target="_blank" class="news-card flex flex-col bg-white dark:bg-dark-surface rounded-2xl overflow-hidden border border-gray-100 dark:border-dark-border h-full">
            <div class="h-48 w-full relative overflow-hidden bg-gray-200">
              <img src="${image}" alt="News" class="w-full h-full object-cover" loading="lazy" onerror="this.src='${fallbackImage}'">
            </div>
            <div class="p-5 flex flex-col flex-1">
              <h3 class="font-display font-bold text-lg leading-snug mb-2 line-clamp-3 text-gray-900 dark:text-white">${article.title}</h3>
              <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2 mb-4 flex-1">${article.description.replace(/<[^>]*>?/gm, '')}</p>
              <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-500 pt-3 border-t border-gray-100 dark:border-dark-border">
                <span class="font-semibold text-brand">${article.author || 'News Desk'}</span>
                <span>${new Date(article.pubDate).toLocaleDateString()}</span>
              </div>
            </div>
          </a>
        `;
        grid.innerHTML += html;
      });
    }

    function updateTicker(articles) {
      const ticker = document.getElementById('ticker-content');
      const headlines = articles.slice(0, 10).map(a => `<a href="${a.link}" target="_blank" class="hover:text-red-200 transition">${a.title}</a>`);
      // Duplicate for seamless loop
      ticker.innerHTML = headlines.join(' &nbsp;&nbsp; | &nbsp;&nbsp; ') + ' &nbsp;&nbsp; | &nbsp;&nbsp; ' + headlines.join(' &nbsp;&nbsp; | &nbsp;&nbsp; ');
    }

    // --- TEXT TO SPEECH & SELECTION TOOLBAR ---
    const toolbar = document.getElementById('selection-toolbar');
    let selectedText = '';

    document.addEventListener('mouseup', (e) => {
      const selection = window.getSelection();
      const text = selection.toString().trim();
      
      if (text.length > 5 && !toolbar.contains(e.target)) {
        selectedText = text;
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        
        toolbar.style.display = 'block';
        toolbar.style.left = `${rect.left + window.scrollX + (rect.width / 2)}px`;
        toolbar.style.top = `${rect.top + window.scrollY - 40}px`;
        toolbar.style.transform = 'translateX(-50%)';
      } else if (!toolbar.contains(e.target)) {
        toolbar.style.display = 'none';
      }
    });

    function readAloud() {
      if (!window.speechSynthesis) return alert('Text-to-speech not supported.');
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(selectedText);
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
      toolbar.style.display = 'none';
    }

    function copyText() {
      navigator.clipboard.writeText(selectedText);
      toolbar.style.display = 'none';
      alert('Copied to clipboard!');
    }

    // Initialize
    fetchNews();
  </script>
</body>
</html>
